spring.application.name=av02
server.address=127.0.0.1
server.port=8080

# Local management listener. No other Actuator endpoints are exposed over HTTP.
management.server.address=127.0.0.1
management.server.port=9099
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.discovery.enabled=false

# Run from AV02 using the supplied script; this relative path stays on D:.
spring.datasource.url=jdbc:h2:file:./data/av02;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${AV02_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Optional local test accounts. Existing users are never overwritten.
av02.test-users.admin-password=${AV02_ADMIN_PASSWORD:}
av02.test-users.maintenance-password=${AV02_MANUTENCAO_PASSWORD:}

# Swagger stays on the application listener; do not persist credentials in the UI.
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=
springdoc.show-actuator=false
