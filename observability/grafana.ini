[server]
http_addr = 127.0.0.1
http_port = 3000
domain = 127.0.0.1
root_url = http://127.0.0.1:3000/

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[auth.anonymous]
enabled = true
org_role = Viewer

[users]
allow_sign_up = false

[plugins]
preinstall_disabled = true

[log]
mode = file
level = info
